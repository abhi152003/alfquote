name: Phase 1 release gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - run: npm test
      - run: bash scripts/check-no-send.sh
      - run: bash scripts/check-package-boundaries.sh
